version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: book-catalog-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-book_catalog}
      DB_USERNAME: ${DB_USERNAME:-book_catalog}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RUN_MIGRATIONS: "true"
      CACHE_WARMUP: "false"
    volumes:
      - ./src:/var/www
      - vendor-data:/var/www/vendor
      - node-modules-data:/var/www/node_modules
    networks:
      - book-catalog-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:alpine
    container_name: book-catalog-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - book-catalog-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: book-catalog-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-book_catalog}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-book_catalog}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - book-catalog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: book-catalog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - book-catalog-network

networks:
  book-catalog-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
  vendor-data:
  node-modules-data:

